<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />

    <meta

    <meta name="color-scheme" content="dark" />
    <title>SERONZ / SYSTEMS ENGINEERING</title>
    <!--
      Restores the original path that public/404.html encoded into the query
      string, so client-side routes survive a GitHub Pages 404. Runs before the
      app mounts and is a no-op for normal requests.
    -->
    <script>
      ;(function (location) {
        if (location.search[1] === '/') {
          var decoded = location.search
            .slice(1)
            .split('&')
            .map(function (segment) {
              return segment.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(
            null,
            '',
            location.pathname.slice(0, -1) + decoded + location.hash,
          )
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
