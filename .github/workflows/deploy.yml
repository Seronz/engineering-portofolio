name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages using GitHub's OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; newer pushes supersede in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        # BASE_URL must match the repository subpath on GitHub Pages, e.g.
        # /engineering-portofolio/. For a user/org site (<user>.github.io) or a
        # custom domain, change this to "/".
        #
        # Contact details come from repository variables
        # (Settings -> Secrets and variables -> Actions -> Variables) so they
        # are never committed. Unset variables simply hide that link.
        env:
          BASE_URL: /${{ github.event.repository.name }}/
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
          VITE_CONTACT_GITHUB: ${{ vars.VITE_CONTACT_GITHUB }}
          VITE_CONTACT_LINKEDIN: ${{ vars.VITE_CONTACT_LINKEDIN }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
