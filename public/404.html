<!--
  GitHub Pages fallback for client-side routing.

  GitHub Pages serves 404.html for any path it does not recognise. A
  single-page app expects those paths to reach index.html instead, so we
  redirect to the site root while preserving the requested path in the query
  string. The small script in index.html then restores the original URL before
  React Router reads it.

  `pathSegmentsToKeep` = number of path segments in the deployed base path.
  For a project site at https://<user>.github.io/<repo>/, that is 1.
  If you later deploy to a custom domain (or a user/org site), set it to 0.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#000000" />
    <style>
      html,
      body {
        background-color: #000000;
      }
    </style>
    <title>Irza Zakaria - Systems Engineering</title>
    <script>
      ;(function () {
        var pathSegmentsToKeep = 1
        var location = window.location
        location.replace(
          location.protocol +
            '//' +
            location.hostname +
            (location.port ? ':' + location.port : '') +
            location.pathname
              .split('/')
              .slice(0, 1 + pathSegmentsToKeep)
              .join('/') +
            '/?/' +
            location.pathname
              .slice(1)
              .split('/')
              .slice(pathSegmentsToKeep)
              .join('/')
              .replace(/&/g, '~and~') +
            (location.search
              ? '&' + location.search.slice(1).replace(/&/g, '~and~')
              : '') +
            location.hash,
        )
      })()
    </script>
  </head>
  <body></body>
</html>
